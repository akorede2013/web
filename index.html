<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Image</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f4f4f4;
}

.container{
    width:500px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    text-align:center;
}

.image-preview{
    width:100%;
    height:300px;
    border:2px dashed #ccc;
    margin:20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

input[type=text],
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    padding:12px;
    background:#007BFF;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="container">

<form action="upload.php" method="POST" enctype="multipart/form-data">

<h2>Upload Image</h2>

<input type="file" name="image" id="imageInput" accept="image/*" required>

<div class="image-preview">
<img id="previewImage">
</div>

<input
type="text"
name="title"
placeholder="Enter Title"
required>

<textarea
name="description"
placeholder="Enter Description"
required></textarea>

<button type="submit">Submit</button>

</form>

</div>

<script>

const input=document.getElementById('imageInput');
const img=document.getElementById('previewImage');

input.addEventListener('change',function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){
img.src=e.target.result;
img.style.display="block";
}

reader.readAsDataURL(file);

}

});

</script>

</body>
</html>
